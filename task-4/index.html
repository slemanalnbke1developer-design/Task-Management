<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link rel="stylesheet" href="./bootstrap-icons.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="bg-light" dir="rtl">
    <div
      class="container bg-secondary bg-opacity-25 border border-info rounded-4 mt-2 text-center"
    >
      <div class="row justify-content-center">
        <div class="col-12 mt-3">
          <h2>ادارة مهام</h2>
        </div>
        <div class="row my-3">
          <div class="col-1">
            <button class="btn btn-danger" id="btnInput">أضف</button>
          </div>
          <div class="col-7">
            <input
              type="text"
              placeholder="وصف المهمة"
              class="form-control"
              id="titleInput"
            />
          </div>
          <div class="col-4">
            <input type="date" class="form-control" id="dateInput" />
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <table class="table table-bordered border-danger">
              <thead class="table-danger border-danger">
                <tr>
                  <th class="col-1">الرقم</th>
                  <th class="col-6">المهمة</th>
                  <th class="col-3">تاريخها</th>
                  <th class="col-1">التنفيذ</th>
                  <th class="col-1">حذف</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr>
                  <td colspan="5" class="text-muted fw-bold py-3">
                    لا يوجد مهام لعرضها
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-auto"><label for="filter">فرز حسب</label></div>
          <div class="col-3">
            <select class="form-select text-center" id="filter">
              <option value="كل المهام">كل المهام</option>
              <option value="نفذت">نفذت</option>
              <option value="لم تنفذ">لم تنفذ</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <script>
      let Tasks = [];
      const inputBtn = document.getElementById("btnInput");
      const inputTitle = document.getElementById("titleInput");
      const inputDate = document.getElementById("dateInput");
      const tBody = document.getElementById("tbody");
      const Filter = document.getElementById("filter");
      let count = 1;
      Filter.addEventListener("change", render);

      inputBtn.addEventListener("click", () => {
        const taskTitle = inputTitle.value;
        const taskDate = inputDate.value;
        const today = new Date().toISOString().split("T")[0];
        if (taskTitle === "" && taskDate === "") {
          alert("يرجى ادخال وصف للمهمة وتاريخ صحيح");
          return;
        } else if (taskDate === "") {
          alert("يرجى ادخال تاريخ صحيح");
          return;
        } else if (taskTitle === "") {
          alert("يرجى ادخال وصف للمهمة");
          return;
        } else if (taskDate < today) {
          alert("لا يمكن إضافة مهمة بتاريخ قديم");
          return;
        }
        const task = {
          id: Date.now(),
          taskTitle: taskTitle,
          taskDate: taskDate,
        };
        Tasks.push(task);
        inputTitle.value = "";
        inputDate.value = "";
        render();
      });
      function render() {
        tBody.innerHTML = "";

        if (Tasks.length === 0) {
          tBody.innerHTML = `
      <tr>
        <td colspan="5" class="text-muted fw-bold py-3">لا يوجد مهام لعرضها</td>
      </tr>`;
          return;
        }
        let filteredTasks = Tasks;
        if (Filter.value === "نفذت") {
          filteredTasks = Tasks.filter((item) => item.completed);
        } else if (Filter.value === "لم تنفذ") {
          filteredTasks = Tasks.filter((item) => !item.completed);
        }
        filteredTasks.sort(
          (a, b) => new Date(a.taskDate) - new Date(b.taskDate),
        );
        filteredTasks.forEach((item, index) => {
          const rowNumber = index + 1;

          const tr = document.createElement("tr");

          const btnClass = item.completed
            ? "btn-success"
            : "btn-outline-success";
          const iconClass = item.completed ? "bi-check-all" : "bi-check-lg";
          const textDecoration = item.completed
            ? "text-decoration-line-through text-muted"
            : "";

          tr.innerHTML = `
      <td>${rowNumber}</td>
      <td class="${textDecoration}">${item.taskTitle}</td>
      <td>${item.taskDate}</td>
      <td>
        <button class="btn btn-sm ${btnClass}" onclick="toggleTasks(${item.id})">
          <i class="bi ${iconClass}"></i>
        </button>
      </td>
      <td>
        <button class="btn btn-sm px-3" onclick="deleteTasks(${item.id})">
          <i class="bi bi-trash text-danger fs-5"></i>
        </button>
      </td>
    `;

          tBody.appendChild(tr);
        });
      }

      function toggleTasks(id) {
        Tasks = Tasks.map((item) => {
          if (item.id === id) {
            return { ...item, completed: !item.completed };
          }
          return item;
        });
        render();
      }
      function deleteTasks(id) {
        Tasks = Tasks.filter((item) => item.id !== id);
        render();
      }
    </script>
    <script src="./bootstrap.bundle.min.js"></script>
  </body>
</html>
